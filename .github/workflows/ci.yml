name: Validate Stoney Music

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Run complete validation
        run: |
          set +e
          npm run validate > ci-validation-output.txt 2>&1
          status=$?
          cat ci-validation-output.txt
          exit "$status"
      - name: Preserve validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controller-validation-output
          path: ci-validation-output.txt
          if-no-files-found: ignore
          retention-days: 1
      - name: Verify runtime imports
        run: node -e "require('./src/player'); require('./src/commands'); console.log('Runtime imports passed.')"
      - name: Check for accidentally committed secrets/runtime files
        run: |
          test ! -f .env
          test ! -f lavalink.jar
          ! git ls-files | grep -E '(^|/)(logs|plugins|node_modules)/|\.jar$|\.log$'
