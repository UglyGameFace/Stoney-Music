name: Validate Stoney Music

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Run validation with full diagnostic capture
        shell: bash
        run: |
          set +e
          npm run validate > validation.log 2>&1
          status=$?
          tail -n 300 validation.log
          exit "$status"
      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-validation-log
          path: validation.log
          if-no-files-found: error
          retention-days: 1
      - name: Verify runtime imports
        run: node -e "require('./src/player'); require('./src/commands'); require('./src/player-controller'); require('./src/autoplay'); require('./src/playback-cache'); require('./src/resilient-guild-player'); require('./src/playback-guild-player'); require('./src/initial-track-selector'); console.log('Runtime imports passed.')"
      - name: Check for accidentally committed secrets/runtime files
        run: |
          test ! -f .env
          test ! -f lavalink.jar
          ! git ls-files | grep -E '(^|/)(logs|plugins|node_modules)/|\.jar$|\.log$'
