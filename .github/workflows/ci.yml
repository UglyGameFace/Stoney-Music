name: Validate Stoney Music

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - name: Verify runtime imports
        run: node -e "require('./src/player'); require('./src/commands'); require('./src/player-controller'); require('./src/autoplay'); require('./src/playback-cache'); require('./src/resilient-guild-player'); console.log('Runtime imports passed.')"
      - name: Check for accidentally committed secrets/runtime files
        run: |
          test ! -f .env
          test ! -f lavalink.jar
          ! git ls-files | grep -E '(^|/)(logs|plugins|node_modules)/|\.jar$|\.log$'
