name: Validate Stoney Music

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Capture generated dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: stoney-music-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - run: npm run validate
      - name: Verify runtime imports
        run: node -e "require('./src/player'); require('./src/commands'); console.log('Runtime imports passed.')"
      - name: Check for accidentally committed secrets/runtime files
        run: |
          test ! -f .env
          test ! -f lavalink.jar
          ! git ls-files | grep -E '(^|/)(logs|plugins|node_modules)/|\.jar$|\.log$'
