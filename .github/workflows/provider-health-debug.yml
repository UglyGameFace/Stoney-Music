name: Provider Health Debug

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Capture complete validation output
        shell: bash
        run: |
          set +e
          npm run validate 2>&1 | tee provider-health-validation.log
          status=${PIPESTATUS[0]}
          echo "$status" > provider-health-validation.status
          exit "$status"
      - name: Upload complete validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-health-validation
          path: |
            provider-health-validation.log
            provider-health-validation.status
